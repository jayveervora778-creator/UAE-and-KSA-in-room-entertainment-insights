version: '3.8'

services:
  survey-dashboard:
    build: 
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: survey-dashboard
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=surveydash2024
    volumes:
      - ../backend/data:/app/backend/data:ro
      - survey_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: survey-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - survey-dashboard
    restart: unless-stopped

volumes:
  survey_logs: