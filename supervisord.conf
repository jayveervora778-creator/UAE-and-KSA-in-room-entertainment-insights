[supervisord]
nodaemon=false
logfile=/home/user/webapp/logs/supervisord.log
pidfile=/home/user/webapp/logs/supervisord.pid
childlogdir=/home/user/webapp/logs

[unix_http_server]
file=/home/user/webapp/logs/supervisor.sock

[supervisorctl]
serverurl=unix:///home/user/webapp/logs/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:survey-dashboard]
command=python3 /home/user/webapp/backend/app.py
directory=/home/user/webapp/backend
autostart=true
autorestart=true
stdout_logfile=/home/user/webapp/logs/survey-dashboard.log
stderr_logfile=/home/user/webapp/logs/survey-dashboard-error.log
environment=FLASK_ENV="production",PYTHONPATH="/home/user/webapp/backend"