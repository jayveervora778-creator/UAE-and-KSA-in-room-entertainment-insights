<!DOCTYPE html>
<html>
<head>
    <title>Minimal Dashboard Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <h2>Minimal Dashboard Test</h2>
    
    <div class="alert alert-info">
        <h5>Test 1: Basic HTML Elements</h5>
        <select id="testSelect" class="form-select">
            <option value="">Select option...</option>
        </select>
        <button id="testBtn" class="btn btn-primary mt-2">Test Button</button>
        <div id="testResult"></div>
    </div>
    
    <div class="alert alert-warning">
        <h5>Test 2: Login and API Test</h5>
        <button id="loginTest" class="btn btn-success">Login & Test API</button>
        <div id="loginResult"></div>
    </div>

    <script>
        console.log('Script loaded');
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM ready');
            
            // Test basic functionality
            document.getElementById('testBtn').addEventListener('click', function() {
                console.log('Button clicked');
                
                const select = document.getElementById('testSelect');
                
                // Add some options
                const options = ['Option 1', 'Option 2', 'Option 3'];
                options.forEach(option => {
                    const optionElement = document.createElement('option');
                    optionElement.value = option;
                    optionElement.textContent = option;
                    select.appendChild(optionElement);
                });
                
                document.getElementById('testResult').innerHTML = '<p class="text-success">✅ Options added to dropdown!</p>';
            });
            
            // Test login and API
            document.getElementById('loginTest').addEventListener('click', async function() {
                const result = document.getElementById('loginResult');
                result.innerHTML = '<p>Testing login...</p>';
                
                try {
                    // Login
                    const loginResponse = await fetch('https://5000-irfwmnj83fl8g7sybafp1-6532622b.e2b.dev/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({
                            username: 'admin',
                            password: 'surveydash2024'
                        })
                    });
                    
                    const loginData = await loginResponse.json();
                    
                    if (loginData.success) {
                        result.innerHTML += '<p class="text-success">✅ Login successful</p>';
                        
                        // Test charts API
                        const apiResponse = await fetch('https://5000-irfwmnj83fl8g7sybafp1-6532622b.e2b.dev/enhanced_api/dynamic-charts', {
                            credentials: 'include'
                        });
                        
                        if (apiResponse.ok) {
                            const apiData = await apiResponse.json();
                            result.innerHTML += `<p class="text-success">✅ API working - ${Object.keys(apiData.charts || {}).length} charts</p>`;
                        } else {
                            result.innerHTML += '<p class="text-danger">❌ API failed</p>';
                        }
                        
                    } else {
                        result.innerHTML += '<p class="text-danger">❌ Login failed</p>';
                    }
                } catch (error) {
                    result.innerHTML += `<p class="text-danger">❌ Error: ${error.message}</p>`;
                }
            });
            
            console.log('Event listeners set up');
        });
    </script>
</body>
</html>
